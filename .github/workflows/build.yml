name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix repositories for Kotlin and Gradle dependencies
        run: |
          # إضافة مستودع mavenCentral و google لملفات الإعدادات تلقائياً لتجنب خطأ نقص المكتبات
          if [ -f "android/build.gradle" ]; then
            echo "Injecting repositories into android/build.gradle"
            sed -i '/allprojects {/a \    repositories {\n        google()\n        mavenCentral()\n    }' android/build.gradle || true
          fi
          if [ -f "android/settings.gradle" ]; then
            echo "Injecting repositories into android/settings.gradle"
            sed -i '/dependencyResolutionManagement {/a \    repositories {\n        google()\n        mavenCentral()\n    }' android/settings.gradle || true
          fi

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
