name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject repositories configuration to Gradle
        run: |
          # هذه الخطوة تبحث عن ملفات الإعدادات في أندرويد وتضمن إضافة مستودع الكوتلن والحزم تلقائياً بدون المساس بالكود الأصلي يدويًا
          GRADLE_INIT_DIR="$HOME/.gradle"
          mkdir -p "$GRADLE_INIT_DIR"
          
          cat << 'EOF' > "$GRADLE_INIT_DIR/init.gradle"
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "Gradle init script created successfully."

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation --init-script $HOME/.gradle/init.gradle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
