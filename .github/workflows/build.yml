name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Upgrade Gradle version automatically for Flutter compatibility
        run: |
          GRADLE_PROP_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP_FILE" ]; then
            echo "Upgrading Gradle version in wrapper..."
            sed -i 's/gradle-.*-bin.zip/gradle-8.14.0-bin.zip/g' "$GRADLE_PROP_FILE"
            cat "$GRADLE_PROP_FILE"
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
