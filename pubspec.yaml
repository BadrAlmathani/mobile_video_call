name: webrtc_local_call
description: "نظام مكالمات صوت وفيديو محلي بين هاتفين أندرويد عبر Wi-Fi باستخدام Flutter WebRTC وسيرفر إشارات بايثون"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Real-time WebRTC audio & video engine
  flutter_webrtc: ^0.12.5

  # Real-time asynchronous WebSocket client
  web_socket_channel: ^3.0.1

  # Android Runtime Camera and Microphone Permissions
  permission_handler: ^11.3.1

  # State Management
  provider: ^6.1.2

  # Persistent local settings (IP, Port, Username)
  shared_preferences: ^2.3.2

  # Date formatting and Internationalization
  intl: any

  # Unique identifier generation for sessions
  uuid: ^4.5.1

  # HTTP client for backend health check
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
